<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="CinemaHub - contact and feedback form with validation and a password strength indicator.">
    <title>CinemaHub - Contact</title>
    <meta name="version" content="3">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=3">

    <script src="js/theme.js?v=3"></script>
</head>

<body>
    <header class="header">
        <div class="logo">CinemaHub</div>

        <nav class="nav-menu" aria-label="Main navigation">
            <a href="index.html">Home</a>
            <a href="movies.html">Movies</a>
            <a href="trailers.html">Trailers</a>
            <a href="reviews.html">Reviews</a>
            <a href="contact.html">Contact</a>
        </nav>

            </header>

    <main>
        <section class="container mt-5 mb-5">
            <h2 class="section-title text-center">Contact Us</h2>

            <div class="row justify-content-center">
                <div class="col-md-8 col-lg-6">
                    <form id="registrationForm" class="form-panel shadow" novalidate>
                        <div class="mb-3">
                            <label for="userName" class="form-label">Name</label>
                            <small id="nameError" class="text-danger d-block"></small>
                            <input type="text" class="form-control" id="userName" placeholder="Your name" required>
                        </div>

                        <div class="mb-3">
                            <label for="userEmail" class="form-label">Email Address</label>
                            <small id="emailError" class="text-danger d-block"></small>
                            <input type="email" class="form-control" id="userEmail" placeholder="name@example.com" required>
                        </div>

                        <div class="mb-3">
                            <label for="userPassword" class="form-label">Password</label>
                            <input type="password" id="userPassword" class="form-control">
                            <small id="passwordError" class="text-danger d-block"></small>
                        </div>

                        <div class="progress mb-2">
                            <div id="strengthBar" class="progress-bar" style="width:0%"></div>
                        </div>
                        <p id="strengthText" class="text-muted-custom"></p>

                        <div class="mb-3">
                            <label for="confirmPassword" class="form-label">Confirm Password</label>
                            <input type="password" id="confirmPassword" class="form-control">
                            <small id="confirmError" class="text-danger d-block"></small>
                        </div>

                        <div class="mb-3">
                            <label for="movieSuggestion" class="form-label">Suggest a Movie</label>
                            <select class="form-select" id="movieSuggestion">
                                <option selected>Select genre...</option>
                                <option value="1">Sci-Fi</option>
                                <option value="2">Drama</option>
                                <option value="3">Comedy</option>
                                <option value="4">Other</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="userMessage" class="form-label">Message or Review</label>
                            <small id="messageError" class="text-danger d-block"></small>
                            <textarea class="form-control" id="userMessage" rows="4" required></textarea>
                        </div>

                        <div id="formResult" class="mb-3"></div>
                        <button type="submit" class="btn custom-btn w-100">Send Message</button>
                    </form>
                </div>
            </div>
        </section>

    </main>

    <footer class="footer text-center">
        <p>&copy; 2026 CinemaHub. All rights reserved.</p>

        <p class="mb-1">
            <a href="index.html">Home</a> &middot;
            <a href="movies.html">Movies</a> &middot;
            <a href="trailers.html">Trailers</a> &middot;
            <a href="reviews.html">Reviews</a> &middot;
            <a href="faq.html">FAQ</a> &middot;
            <a href="contact.html">Contact</a>
        </p>
    </footer>

    <script src="js/jquery.min.js?v=3"></script>
    <script src="js/api.js?v=3"></script>
    <script src="js/script.js?v=3"></script>
</body>
</html>
