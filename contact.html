<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CinemaHub - Contact</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="header">
        <div class="logo">CinemaHub</div>
        <nav class="nav-menu">
            <a href="index.html">Home</a>
            <a href="movies.html">Movies</a>
            <a href="trailers.html">Trailers</a>
            <a href="reviews.html">Reviews</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>
    <main class="container mt-5 mb-5">
        <h2 class="text-center mb-4">Contact Us</h2>
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <form class="p-4 bg-dark rounded shadow">
                    <div class="mb-3">
                        <label for="userName" class="form-label text-light">Name</label>
                        <input type="text" class="form-control" id="userName" placeholder="Palenshe Tugenshe" required>
                    </div>
                    <div class="mb-3">
                        <label for="userEmail" class="form-label text-light">Email Address</label>
                        <input type="email" class="form-control" id="userEmail" placeholder="name@example.com" required>
                    </div>
                    <div class="mb-3">
                        <label for="movieSuggestion" class="form-label text-light">Suggest a Movie</label>
                        <select class="form-select" id="movieSuggestion">
                            <option selected>Select genre...</option>
                            <option value="1">Sci-Fi</option>
                            <option value="2">Drama</option>
                            <option value="3">Comedy</option>
                            <option value="4">Other</option>
                        </select>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <footer class="footer text-center">
        <p>&copy; 2026 CinemaHub. All rights reserved.</p>
    </footer>

</body>
</html>
